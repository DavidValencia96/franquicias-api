version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb_franquicias
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=franquicias_db

  app:
    build: .
    container_name: franquicias_api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/franquicias_db
    depends_on:
      - mongodb